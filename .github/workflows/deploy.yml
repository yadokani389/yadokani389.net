name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.action != 'closed'
    env:
      CF_SEND_TELEMETRY: "false"
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}
          gc-max-store-size-linux: 5G

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: nix profile add .#ci && pnpm install --frozen-lockfile

      - name: Check Nix configuration
        run: nix flake check

      - name: Validate and build the project
        run: pnpm check
        env:
          CLOUDFLARE_PREVIEW_NUMBER: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
          SITE_URL: ${{ github.event_name == 'pull_request' && format('https://yadokani389-net-preview-{0}.yadokani389.workers.dev', github.event.number) || '' }}

      - name: Set up Chromium
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(nix build .#chromium --print-out-paths --no-link)/bin/chromium" >> "$GITHUB_ENV"

      - name: Test the built site
        run: pnpm test:e2e

      - name: Validate deployment output
        run: pnpm exec cf deploy --prebuilt --mode "$BUILD_MODE" --dry-run
        env:
          BUILD_MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
          CLOUDFLARE_PREVIEW_NUMBER: ${{ github.event_name == 'pull_request' && github.event.number || '' }}

      - name: Deploy to Production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Preview
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PREVIEW_NUMBER: ${{ github.event.number }}

      - name: Comment Preview URL
        if: steps.preview.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ format('https://yadokani389-net-preview-{0}.yadokani389.workers.dev', github.event.number) }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const body = `## Preview Deployment\n\nPreview URL: ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  cleanup:
    name: Cleanup Preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Install deployment tools
        run: nix profile add .#ci && pnpm install --frozen-lockfile --prod
      - name: Delete preview Worker
        run: pnpm exec cf workers delete "yadokani389-net-preview-$PREVIEW_NUMBER" --force
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NUMBER: ${{ github.event.number }}
