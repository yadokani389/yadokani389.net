<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>yadokani389 · OG artwork</title>
    <style>
      @import url("../../node_modules/@fontsource/m-plus-rounded-1c/japanese-500.css");
      @import url("../../node_modules/@fontsource/m-plus-rounded-1c/latin-500.css");

      @font-face {
        font-family: Fredoka;
        src: url("../../node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2")
          format("woff2");
        font-weight: 500;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: linear-gradient(140deg, #cfe1c6, #ddd1ef);
        color: #1e4842;
        font-family: "M PLUS Rounded 1c", sans-serif;
      }

      .card {
        position: absolute;
        inset: 40px;
        border-radius: 28px;
        background: #fffdf5;
      }

      main {
        position: absolute;
        top: 72px;
        left: 90px;
        right: 90px;
      }

      h1 {
        margin: 0;
        font:
          500 144px/1.15 Fredoka,
          sans-serif;
        letter-spacing: -4px;
      }

      .description {
        margin: 20px 0 0;
        font-size: 34px;
        line-height: 1.4;
        letter-spacing: 0.08em;
        color: #647a70;
      }

      .lockup {
        position: absolute;
        left: 90px;
        bottom: 90px;
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .disc {
        display: flex;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: #e8f0e2;
        align-items: center;
        justify-content: center;
      }

      .disc img {
        width: 82px;
        height: 82px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }

      .domain {
        margin: 0;
        font:
          500 30px/1 Fredoka,
          sans-serif;
      }

      [data-view="article"] main {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card"></div>
    <main>
      <h1>yadokani389</h1>
      <p class="description">制作物と日々の記録</p>
    </main>
    <div class="lockup">
      <span class="disc">
        <img src="../../public/favicon.png" alt="" width="82" height="82" />
      </span>
      <p class="domain">yadokani389.net</p>
    </div>
  </body>
</html>
